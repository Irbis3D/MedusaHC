[delayed_gcode INIT_SENSOR_STATE]
initial_duration: 2
gcode:
    RESPOND MSG="INIT_SENSOR_STATE"

    {% set ct = printer["pin_watch io"].current_tool|int %}
    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
    {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}
    {% if direction not in [-1, 1] %}
        {action_raise_error("TOOL_CFG.tools_direction must be 1 or -1")}
    {% endif %}

    {% set tmc_e = printer.configfile.settings['tmc2209 extruder'] %}
    {% set e_cur = tmc_e.run_current|float %}
    {% set e_mult = printer["gcode_macro TOOL_CFG"].e_cur_high_mult|float %}
    {% set e_hi = e_cur * e_mult %}

    {% set sv = printer.save_variables.variables %}

    CLOSE

    {% set fast_spd  = printer["gcode_macro TOOL_CFG"].fast_speed|float %}
    {% set slow_spd  = printer["gcode_macro TOOL_CFG"].slow_speed|float %}
    {% set clean_spd = printer["gcode_macro TOOL_CFG"].clean_speed|float %}
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=fast_feedrate  VALUE={fast_spd  * 60}
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=slow_feedrate  VALUE={slow_spd  * 60}
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=clean_feedrate VALUE={clean_spd * 60}

    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=e_cur VALUE={e_cur}
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=e_cur_high VALUE={e_hi}

 # Initial tool offset setup.

    {% for T in range(max_tool) %}
      {% set sx = "t" ~ T ~ "_gcode_x_offset" %}
      {% set sy = "t" ~ T ~ "_gcode_y_offset" %}
      {% set sz = "t" ~ T ~ "_gcode_z_offset" %}

    {% if sx in sv and sy in sv and sz in sv %}
        {% set x = sv[sx]|float %}
        {% set y = sv[sy]|float %}
        {% set z = sv[sz]|float %}

        {% set kx = "t" ~ T ~ "_off_x" %}
        {% set ky = "t" ~ T ~ "_off_y" %}
        {% set kz = "t" ~ T ~ "_off_z" %}

        SET_GCODE_VARIABLE MACRO=TOOL_OFFSET VARIABLE={kx} VALUE={x}
        SET_GCODE_VARIABLE MACRO=TOOL_OFFSET VARIABLE={ky} VALUE={y}
        SET_GCODE_VARIABLE MACRO=TOOL_OFFSET VARIABLE={kz} VALUE={z}

        {action_respond_info(
            "INIT TOOL_OFFSET T" ~ T ~
            ": X=" ~ x ~
            " Y=" ~ y ~
            " Z=" ~ z
        )}
      {% endif %}
    {% endfor %}

 # End of initial tool offset setup.

[gcode_macro OPEN]
gcode:
  {% set is_open = printer["gcode_macro GLOBAL_STATE"].feeder_open|int %}
  {% set high_cur = printer["gcode_macro GLOBAL_STATE"].e_cur_high|float %}
  {% if is_open == 1 %}
    #RESPOND MSG="Feeder already open"
  {% else %}
    {% set base_cur = printer["gcode_macro GLOBAL_STATE"].e_cur|float %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% set new_accel = printer["gcode_macro TOOL_CFG"].fast_accel %}
    {% set e_open = printer["gcode_macro TOOL_CFG"].e_open|float %}
    {% set servo_open_angle = printer["gcode_macro TOOL_CFG"].servo_open_angle|default(90)|float %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    SET_VELOCITY_LIMIT ACCEL={new_accel}
    SET_SERVO SERVO=my_servo ANGLE={servo_open_angle}
    G91
    G4 P200
    SET_TMC_CURRENT STEPPER=extruder CURRENT={high_cur}
    G1 E-0.3 F1000
    G1 E0.3 F1000
    G1 E-0.3 F1000
    G1 E0.3 F1000
    G1 E{e_open} F2500
    G90
    SET_VELOCITY_LIMIT ACCEL={old_accel}
    SET_TMC_CURRENT STEPPER=extruder CURRENT={base_cur}
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=feeder_open VALUE=1
  {% endif %}


[gcode_macro CLOSE]
gcode:
  #RESPOND MSG="CLOSE"
  {% set e_close = printer["gcode_macro TOOL_CFG"].e_close|float %}
  {% set servo_close_angle = printer["gcode_macro TOOL_CFG"].servo_close_angle|default(180)|float %}
  SET_SERVO SERVO=my_servo ANGLE={servo_close_angle}
  SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=feeder_open VALUE=0
  G91
  G1 E{e_close} F6000
  G90

[gcode_macro SET]
gcode:

    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
    {% set target_tool = printer["gcode_macro GLOBAL_STATE"].target_tool|int %}
    {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}
    {% if 'T' not in params %}
        RESPOND MSG="SET: missing T"
        ERROR
    {% else %}
        {% set T = params.T|int %}
        {% if T < 0 or T >= max_tool %}
            RESPOND MSG="SET: bad T"
            ERROR
        {% else %}
            {% set ct = printer["pin_watch io"].current_tool|int %}
            SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=error_state VALUE=0
            SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=target_tool VALUE={T}
            HOME_REQUEST
           # TOOL_OFFSET_T T={T} MOVE=0


            {% if printer.print_stats.state|string == "printing" %}
                G91
                G1 Y{-2 * direction} F15000
                G1 Z3 F14000
                G90
            {% else %}
                G91
                G1 Z1 F14000
                G90
            {% endif %}
            {% if ct == -2 %}
                RESPOND MSG="SET: sensor error"
                ERROR
            {% elif ct == T %}
                RESPOND MSG="SET: already T{T}"
            {% elif ct >= 0 and ct < max_tool and ct != T %}
                #RESPOND MSG="SET: change"
                DROP
                SET_CHECK T={T}
            {% else %}
                SET_CHECK T={T}
            {% endif %}
        {% endif %}
    {% endif %}



[gcode_macro SET_CHECK]
gcode:
    {% if printer["gcode_macro GLOBAL_STATE"].error_state|int == 1 %}
        RESPOND MSG="SET_CHECK: paused after DROP"
    {% else %}
        {% set T = params.T|int %}
        {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
        {% set ct = printer["pin_watch io"].current_tool|int %}

        {% if ct == -2 %}
            RESPOND MSG="SET_CHECK: sensor error"
            ERROR
        {% elif ct == T %}
            TOOL_OFFSET_T T={T}
            RESPOND MSG="SET_CHECK: tool already installed"
        {% elif ct >= 0 and ct < max_tool and ct != T %}
            RESPOND MSG="SET_CHECK: wrong tool (need change)"
            ERROR
        {% elif ct == -1 %}
            #RESPOND MSG="SET_CHECK: ok"
            SET_MOVE T={T}
        {% else %}
            RESPOND MSG="SET_CHECK: invalid current_tool"
            ERROR
        {% endif %}
    {% endif %}


[gcode_macro SET_MOVE]
gcode:
    {% set T = params.T|int %}
    {% set y_safe  = printer["gcode_macro TOOL_CFG"].y_safe|float %}
    {% set y_latch = printer["gcode_macro TOOL_CFG"].y_latch|float %}
    {% set y_prime = printer["gcode_macro TOOL_CFG"].y_prime|float %}
    {% set x_prime_shift = printer["gcode_macro TOOL_CFG"].x_prime_shift|float %}
    {% set x_shift = printer["gcode_macro TOOL_CFG"].x_shift|float %}
    {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}

    {% set x_key = "x_t" ~ T %}
    {% set x_base = printer["gcode_macro TOOL_CFG"][x_key]|float %}

    {% set fo = printer["gcode_macro GLOBAL_STATE"].feeder_open|int %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% set new_accel = printer["gcode_macro TOOL_CFG"].fast_accel %}
    {% set feedrate      = printer["gcode_macro GLOBAL_STATE"].fast_feedrate|float %}
    {% set slow_feedrate = printer["gcode_macro GLOBAL_STATE"].slow_feedrate|float %}
    #RESPOND MSG="SET_MOVE start"

    {% if fo != 1 %}
        #RESPOND MSG="SET_MOVE: feeder closed -> OPEN"
        OPEN
    {% endif %}
    TOOL_OFFSET_T T=0
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1
    SET_VELOCITY_LIMIT ACCEL={new_accel}
    G90
    G1 Y{y_safe} X{x_base} F{feedrate}
    G1 Y{y_latch + 20 * direction} F{feedrate}
    G1 Y{y_latch} F{slow_feedrate}
    G1 Y{y_latch - 0.1 * direction} F{slow_feedrate}
    G1 Y{y_latch} F{slow_feedrate}
    G1 X{x_base - (x_shift - 4) * direction} F{feedrate}
    G1 X{x_base - x_shift * direction} F{slow_feedrate}
    G1 Y{y_latch + 5 * direction} F{slow_feedrate}
    M106 S255
    G4 P1000
    VERIFY_SET T={T}

[gcode_macro VERIFY_SET]
gcode:
    {% set y_safe = printer["gcode_macro TOOL_CFG"].y_safe|float %}
    {% set y_brush = printer["gcode_macro TOOL_CFG"].y_brush|float %}
    {% set x_prime_shift = printer["gcode_macro TOOL_CFG"].x_prime_shift|float %}
    {% set y_prime = printer["gcode_macro TOOL_CFG"].y_prime|float %}
    {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% set new_accel = printer["gcode_macro TOOL_CFG"].fast_accel %}

    {% set T = params.T|int %}
    {% set x_key = "x_t" ~ T %}
    {% set x_base = printer["gcode_macro TOOL_CFG"][x_key]|float %}
    {% set ct = printer["pin_watch io"].current_tool|int %}
    {% set extr = 'extruder' if T == 0 else 'extruder' ~ T %}
    {% set temp = printer[extr].temperature|float %}
    {% set state_macro = "gcode_macro TOOL_STATE_" ~ ct %}
    {% set feedrate = printer["gcode_macro GLOBAL_STATE"].fast_feedrate|float %}

    {% if ct != T %}
        RESPOND MSG="VERIFY_SET: mismatch"
        ERROR
    {% else %}
        RESPOND MSG="VERIFY_SET OK"

        CLOSE
        G4 P200

        {% if printer.print_stats.state|string == "printing" and temp > 170.0 %}

            {% set fp_flag = printer[state_macro].first_prime_flag|int %}
            {% set fp_enabled = printer[state_macro].first_prime_enabled|default(1)|int %}
            {% set fp_amt = printer[state_macro].first_prime_amount|float %}
            {% set fp_spd = printer[state_macro].first_prime_speed|float %}
            {% set fp_f = (fp_spd * 60.0)|int %}

            {% if fp_enabled == 1 and fp_flag == 0 %}
                RESPOND MSG="FIRST PRIME: executed"
                G91
                G1 E{fp_amt} F{fp_f}
                G90
                SET_GCODE_VARIABLE MACRO=TOOL_STATE_{ct} VARIABLE=first_prime_flag VALUE=1
            {% else %}
                RESPOND MSG="FIRST PRIME: skipped"
            {% endif %}

            {% set amt = printer[state_macro].prime_amount|float %}
            {% set spd = printer[state_macro].prime_speed|float %}

            {% set r_pamt = printer[state_macro].prime_retract|float %}
            {% set r_pspd = printer[state_macro].prime_retract_speed|float %}

            {% set e1 = amt * 0.20 %}
            {% set e2 = amt * 0.30 %}
            {% set e3 = amt * 0.50 %}

            {% set f1 = (spd * 0.50 * 60.0)|int %}
            {% set f2 = (spd * 0.75 * 60.0)|int %}
            {% set f3 = (spd * 1.00 * 60.0)|int %}
            {% set pfr = (r_pspd * 60.0)|int %}

            G91
            G1 E{e1} F{f1}
            G1 E{e2} F{f2}
            G1 E{e3} F{f3}
            G1 E-{r_pamt} F{pfr}
            G90
            RESPOND MSG="PRIME: T executed"

        {% endif %}

        {% if printer.print_stats.state|string == "printing" %}
            {% set clean_move = printer[state_macro].clean_move|default(1)|int %}
            {% if clean_move == 1 %}
            {% set x_clean_move = printer[state_macro].x_clean_move|float %}
            {% set y_clean_move = printer[state_macro].y_clean_move|float %}
            {% set clean_move_speed = printer[state_macro].clean_move_speed|float %}
            {% set clean_move_feedrate = (clean_move_speed * 60.0)|int %}
            {% set ptfe_clean_slow_speed = printer[state_macro].ptfe_clean_slow_speed|float %}
            {% set ptfe_clean_slow_feedrate = (ptfe_clean_slow_speed * 60.0)|int %}
			{% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}
            {% set r_amt = printer[state_macro].clean_retract|float %}
            {% set r_spd = printer[state_macro].clean_retract_speed|float %}
            {% set rf = (r_spd * 60.0)|int %}

			G90
            G1 X{x_base - x_prime_shift * direction} F{feedrate} 		
    		G1 Y{y_prime} F{feedrate}
            G91
            G1 F{feedrate}
            
            # PTFE clean move
            G1 X{10 * direction} F{ptfe_clean_slow_feedrate}
            G1 Y{6 * direction} F{feedrate}
            G1 X{(-10)* direction} F{feedrate}
            G1 X{10 * direction} F{ptfe_clean_slow_feedrate}
            
            # Brush clean move
            G1 X{10 * direction} F{feedrate}
            G1 Y{(-8) * direction} F{feedrate}
            G1 X{(-x_clean_move) * direction} Y{y_clean_move * direction} F{clean_move_feedrate}
            G1 Y{(-y_clean_move) * direction} F{clean_move_feedrate}
            G1 X{x_clean_move * direction} Y{y_clean_move * direction} F{clean_move_feedrate}
            G1 Y{(-y_clean_move) * direction} F{clean_move_feedrate}
            G1 X{(-x_clean_move) * direction} Y{y_clean_move * direction} F{clean_move_feedrate}
            G1 E-{r_amt} F{rf}
            G90
            G1 Y{y_safe} F{feedrate}
            TOOL_OFFSET_T T={ct}
            G1 F{feedrate}
            {% else %}
            G90
            G1 Y{y_safe} F{feedrate}
            TOOL_OFFSET_T T={ct}
            {% endif %}
        {% else %}
            G1 Y{y_safe} F{feedrate}
            TOOL_OFFSET_T T={ct}
            G90
        {% endif %}
    {% endif %}
    M106 S0



[gcode_macro DROP]
gcode:
    HOME_REQUEST
    DROP_CHECK


[gcode_macro DROP_CHECK]
gcode:
    {% set ct = printer["pin_watch io"].current_tool|int %}
    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}

    {% if ct == -2 %}
        RESPOND MSG="DROP_CHECK: sensor error"
        ERROR
    {% elif ct == -1 %}
        RESPOND MSG="DROP_CHECK: nothing installed"
    {% elif ct < 0 or ct >= max_tool %}
        RESPOND MSG="DROP_CHECK: invalid current_tool"
        ERROR
    {% else %}
        RESPOND MSG="DROP_CHECK: T{ct}"
        DROP_MOVE T={ct}
    {% endif %}


[gcode_macro DROP_MOVE]
gcode:
    {% set T = params.T|int %}
    {% set y_safe  = printer["gcode_macro TOOL_CFG"].y_safe|float %}
    {% set y_latch = printer["gcode_macro TOOL_CFG"].y_latch|float %}
    {% set x_shift = printer["gcode_macro TOOL_CFG"].x_shift|float %}
    {% set y_brush = printer["gcode_macro TOOL_CFG"].y_brush|float %}
    {% set y_prime = printer["gcode_macro TOOL_CFG"].y_prime|float %}
    {% set x_prime_shift = printer["gcode_macro TOOL_CFG"].x_prime_shift|float %}
    {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}

    {% set x_key = "x_t" ~ T %}
    {% set x_base = printer["gcode_macro TOOL_CFG"][x_key]|float %}

    {% set fo = printer["gcode_macro GLOBAL_STATE"].feeder_open|int %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% set new_accel = printer["gcode_macro TOOL_CFG"].fast_accel %}
    {% set feedrate      = printer["gcode_macro GLOBAL_STATE"].fast_feedrate|float %}
    {% set slow_feedrate = printer["gcode_macro GLOBAL_STATE"].slow_feedrate|float %}
    TOOL_OFFSET_T T=0
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1
    SET_VELOCITY_LIMIT ACCEL={new_accel}
    G90
    G1 Y{y_safe} X{x_base + 10 * direction} F{feedrate}
    M106 S255
    G1 Y{y_brush + 3 * direction} F{feedrate}
    G1 X{x_base - x_prime_shift * direction} F{feedrate}
    {% if fo != 1 %}
    #RESPOND MSG="DROP_MOVE: feeder closed -> OPEN"
      OPEN
    {% endif %}

    #RESPOND MSG="DROP_MOVE start"
    G90
    G1 Y{y_latch + 8 * direction} F{feedrate}
    G1 X{x_base - x_shift * direction} F{feedrate}
    G1 Y{y_latch} F{feedrate}
    G1 X{x_base} F{slow_feedrate}
    G1 Y{y_safe} F{feedrate}
    SET_VELOCITY_LIMIT ACCEL={old_accel}
    #RESPOND MSG="DROP_MOVE done"
    G4 P1100
    VERIFY_DROP

[gcode_macro VERIFY_DROP]
gcode:
    {% set ct = printer["pin_watch io"].current_tool|int %}

    {% if ct != -1 %}
        RESPOND MSG="VERIFY_DROP: mismatch"
        ERROR
    {% else %}
        RESPOND MSG="VERIFY_DROP OK"
    {% endif %}


[gcode_macro DROP_TOOL]
variable_active: 0
variable_color: ""
gcode:
      SAVE_GCODE_STATE
      RESPOND MSG="DROP and CLOSE"
      DROP
      CLOSE
      M106 S0
      #RESTORE_GCODE_STATE MOVE=1


[gcode_macro CLEAN]
gcode:
    {% set ct = printer["pin_watch io"].current_tool|int %}
    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}

    {% if ct < 0 or ct >= max_tool %}
        RESPOND MSG="CLEAN: no valid tool selected"
        ERROR
    {% else %}
        {% set homed = printer.toolhead.homed_axes|string %}
        HOME_REQUEST

        {% set y_safe  = printer["gcode_macro TOOL_CFG"].y_safe|float %}
        {% set y_brush = printer["gcode_macro TOOL_CFG"].y_brush|float %}
        {% set old_accel = printer.toolhead.max_accel %}
        {% set new_accel = printer["gcode_macro TOOL_CFG"].fast_accel %}
        {% set feedrate      = printer["gcode_macro GLOBAL_STATE"].fast_feedrate|float %}
        {% set feedrate_clean = printer["gcode_macro GLOBAL_STATE"].clean_feedrate|float %}
        {% set y_prime= printer["gcode_macro TOOL_CFG"].y_prime|float %}
        {% set x_prime_shift= printer["gcode_macro TOOL_CFG"].x_prime_shift|float %}
        {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}

        {% set x_key = "x_t" ~ ct %}
        {% set x_base = printer["gcode_macro TOOL_CFG"][x_key]|float %}

        #RESPOND MSG="CLEAN: current tool"
        SET_VELOCITY_LIMIT ACCEL={new_accel}
        G90
        G1 Y{y_safe} F{feedrate}
        G1 X{x_base} F{feedrate}
        G1 Y{y_prime} F{feedrate}
        G1 X{x_base - x_prime_shift * direction} F{feedrate}
        G1 Y{y_brush} F{feedrate}
        G1 X{x_base - x_prime_shift * direction + 10 * direction} F{feedrate_clean}
        G1 X{x_base - x_prime_shift * direction} F{feedrate_clean}
        G1 X{x_base - x_prime_shift * direction + 10 * direction} F{feedrate_clean}
        G1 X{x_base - x_prime_shift * direction} F{feedrate_clean}
        G1 X{x_base - x_prime_shift * direction + 10 * direction} F{feedrate_clean}
        G1 X{x_base - x_prime_shift * direction} F{feedrate_clean}
        G1 X{x_base} F{feedrate}
        G1 Y{y_safe} F{feedrate}
        SET_VELOCITY_LIMIT ACCEL={old_accel}
    {% endif %}

[gcode_macro ERROR]
gcode:
    {% set y_safe = printer["gcode_macro TOOL_CFG"].y_safe|float %}
    {% set target_tool = printer["gcode_macro GLOBAL_STATE"].target_tool|int %}
    {% set direction = printer["gcode_macro TOOL_CFG"].tools_direction|int %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="ERROR"
        SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=error_state VALUE=1
        G90
        G1 Y{y_safe + 50 * direction} F6000
        PAUSE
        {action_respond_info("Error - Target tool - " ~ target_tool )}
    {% else %}
        RESPOND MSG="ERROR set (no print, no pause)"
    {% endif %}


[gcode_macro TOOL_OFFSET_T]
description: Apply offsets for tool T from TOOL_OFFSET (with inverted sign)
gcode:
    {% if 'T' not in params %}
        RESPOND MSG="TOOL_OFFSET_T: missing T"
        ERROR
    {% else %}
        {% set T = params.T|int %}
        {% set MOVE = params.MOVE|default(1)|int %}
        {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
        {% if T < 0 or T >= max_tool %}
            RESPOND MSG="TOOL_OFFSET_T: bad T"
            ERROR
        {% else %}
            {% set kx = "t" ~ T ~ "_off_x" %}
            {% set ky = "t" ~ T ~ "_off_y" %}
            {% set kz = "t" ~ T ~ "_off_z" %}

            {% set x = printer["gcode_macro TOOL_OFFSET"][kx]|float %}
            {% set y = printer["gcode_macro TOOL_OFFSET"][ky]|float %}
            {% set z = printer["gcode_macro TOOL_OFFSET"][kz]|float %}


            SET_GCODE_OFFSET X={x} Y={y} Z={z} MOVE={MOVE}
            {action_respond_info("TOOL_OFFSET_T: X=" ~ x ~ " Y=" ~ y ~ " Z=" ~ z ~ " MOVE=" ~ MOVE)}
        {% endif %}
    {% endif %}

[gcode_macro ASSIGN_TCH_TOOL]
description: Manual sync klipper-toolchanger active tool to GLOBAL_STATE.current_tool
gcode:
  {% set ct = printer["pin_watch io"].current_tool|int %}
  {% if ct >= 0 %}
    INITIALIZE_TOOLCHANGER T={ct}
    {action_respond_info("ASSIGN_TOOL: INITIALIZE_TOOLCHANGER T=" ~ ct)}
  {% else %}
    {action_respond_info("No tool installed. Initialization after next change. ")}
  {% endif %}

[gcode_macro LAYER_SET]
gcode:
    {% if 'L' in params %}
        SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=layer VALUE={params.L|int}
    {% endif %}

[gcode_macro PRIME_FLAGS_CLEAR]
gcode:
    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
    {% for t in range(max_tool) %}
        SET_GCODE_VARIABLE MACRO=TOOL_STATE_{t} VARIABLE=first_prime_flag VALUE=0
    {% endfor %}
    RESPOND MSG="PRIME FLAG CLEAR"

[gcode_macro PRIME_FLAGS_SET]
gcode:
    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
    {% for t in range(max_tool) %}
        SET_GCODE_VARIABLE MACRO=TOOL_STATE_{t} VARIABLE=first_prime_flag VALUE=1
    {% endfor %}
    RESPOND MSG="PRIME FLAG SET"

[gcode_macro TEST_TOOLS]
description: Pickup tools 0..max_tool-1 sequentially with delays, then drop current tool
gcode:
    {% set max_tool = printer["gcode_macro GLOBAL_STATE"].max_tool|int %}
    OPEN
    CLOSE
    {% for t in range(max_tool) %}
        T{t}
        G4 P1000
    {% endfor %}

    DROP_TOOL
