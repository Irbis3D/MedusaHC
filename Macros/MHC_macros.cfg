# MedusaHC command surface. Motion and verification live in medusahc.py.
# This file intentionally keeps the traditional name so an existing MedusaHC
# installation can migrate by replacing MHC_macros.cfg and installing medusahc.py.

[medusahc]
pin_watch: pin_watch io
sensor_timeout: 0.50

[gcode_macro SET]
gcode:
    MHC_SET T={params.T}

[gcode_macro _DROP]
gcode:
    MHC_DROP

[gcode_macro DROP_TOOL]
variable_active: 0
variable_color: ""
gcode:
    SAVE_GCODE_STATE
    MHC_DROP
    MHC_CLOSE
    M106 S0

[gcode_macro OPEN]
gcode:
    MHC_OPEN

[gcode_macro CLOSE]
gcode:
    MHC_CLOSE

[gcode_macro CLEAN]
gcode:
    MHC_CLEAN

[gcode_macro _ERROR]
gcode:
    MHC_ERROR

[gcode_macro _TOOL_OFFSET_T]
description: Apply offsets for tool T
gcode:
    MHC_TOOL_OFFSET T={params.T} MOVE={params.MOVE|default(1)}

[gcode_macro ASSIGN_TCH_TOOL]
gcode:
    MHC_ASSIGN_TOOL

[gcode_macro _LAYER_SET]
gcode:
    {% if 'L' in params %}
        MHC_LAYER_SET L={params.L}
    {% endif %}

[gcode_macro PRIME_FLAGS_CLEAR]
gcode:
    {% set global_name = "gcode_macro _GLOBAL_STATE"
        if printer["gcode_macro _GLOBAL_STATE"] is defined
        else "gcode_macro GLOBAL_STATE" %}
    {% set state_prefix = "_TOOL_STATE_"
        if printer["gcode_macro _TOOL_STATE_0"] is defined
        else "TOOL_STATE_" %}
    {% for t in range(printer[global_name].max_tool|int) %}
        SET_GCODE_VARIABLE MACRO={state_prefix}{t} VARIABLE=first_prime_flag VALUE=0
    {% endfor %}

[gcode_macro _PRIME_FLAGS_SET]
gcode:
    {% set global_name = "gcode_macro _GLOBAL_STATE"
        if printer["gcode_macro _GLOBAL_STATE"] is defined
        else "gcode_macro GLOBAL_STATE" %}
    {% set state_prefix = "_TOOL_STATE_"
        if printer["gcode_macro _TOOL_STATE_0"] is defined
        else "TOOL_STATE_" %}
    {% for t in range(printer[global_name].max_tool|int) %}
        SET_GCODE_VARIABLE MACRO={state_prefix}{t} VARIABLE=first_prime_flag VALUE=1
    {% endfor %}

[gcode_macro TEST_TOOLS]
gcode:
    {% set global_name = "gcode_macro _GLOBAL_STATE"
        if printer["gcode_macro _GLOBAL_STATE"] is defined
        else "gcode_macro GLOBAL_STATE" %}
    MHC_OPEN
    MHC_CLOSE
    {% for t in range(printer[global_name].max_tool|int) %}
        MHC_SET T={t}
    {% endfor %}
    MHC_DROP
    MHC_CLOSE
    M106 S0
