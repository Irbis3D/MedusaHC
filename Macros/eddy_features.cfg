[gcode_macro TOOL_Z_CALIBRATION]
description: Calibrate T1-T3 Z offsets with native Eddy tap probing
gcode:
    {% set N = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}

    G28

    {% for i in range(N) %}
        M104 T{i} S150
    {% endfor %}
    M109 T0 S150

    T0
    CLEAN
    G90
    G1 Z5 F300
    G1 X115 Y110 F12000
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    PROBE METHOD=tap
    _APPLY_TAP_KINEMATIC

    _TOOL_Z_PROBE T=0

    {% for i in range(1, N) %}
        T{i}
        CLEAN
        _TOOL_Z_PROBE T={i}
    {% endfor %}

    TOOL_Z_SAVE
    DROP_TOOL
    G90
    G1 X10 Y210 F12000

    {% for i in range(N) %}
        M104 T{i} S0
    {% endfor %}

    RESPOND MSG="TOOL_Z_CALIBRATION done"


[gcode_macro _TOOL_Z_PROBE]
description: Run a native Eddy tap for one tool
gcode:
    {% set T = params.T|int %}
    G90
    G1 Z5 F300
    G1 X115 Y110 F12000
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    PROBE METHOD=tap
    _TOOL_Z_STORE_RESULT T={T}


[gcode_macro _TOOL_Z_STORE_RESULT]
description: Store the latest native tap result as a tool Z offset
gcode:
    {% set T = params.T|int %}
    {% set N = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}

    {% if T < 0 or T >= N %}
        {action_raise_error("_TOOL_Z_STORE_RESULT: invalid tool")}
    {% endif %}

    {% set measured_z = printer.probe.last_probe_position.z|float %}

    {% if T == 0 %}
        SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=t0_probe_z VALUE={measured_z}
        SET_GCODE_VARIABLE MACRO=_TOOL_OFFSET VARIABLE=t0_off_z VALUE=0.0
        RESPOND MSG="TOOL_Z: T0 reference={measured_z}"
    {% else %}
        {% set base_z = printer["gcode_macro _GLOBAL_STATE"].t0_probe_z|float %}
        {% set offset_z = measured_z - base_z %}
        {% set key = "t" ~ T ~ "_off_z" %}

        SET_GCODE_VARIABLE MACRO=_TOOL_OFFSET VARIABLE={key} VALUE={offset_z}
        RESPOND MSG="TOOL_Z: T{T} measured={measured_z} offset={offset_z}"
    {% endif %}


[gcode_macro TOOL_Z_SAVE]
description: Save calibrated tool Z offsets
gcode:
    {% set N = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}
    {% set ns = namespace(msg="T0=0") %}

    {% for i in range(1, N) %}
        {% set key = "t" ~ i ~ "_off_z" %}
        {% set z = printer["gcode_macro _TOOL_OFFSET"][key]|float %}

        SAVE_VARIABLE VARIABLE={"t" ~ i ~ "_gcode_z_offset"} VALUE={z}
        {% set ns.msg = ns.msg ~ " T" ~ i ~ "=" ~ ("%.3f"|format(z)) %}
    {% endfor %}

    {action_respond_info("TOOL_Z_SAVE: saved (" ~ ns.msg ~ ")")}
