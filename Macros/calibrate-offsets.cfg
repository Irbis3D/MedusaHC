[tools_calibrate]
pin: ^PD13
travel_speed: 20
spread: 7  # mms to travel sideways for XY probing
lower_z: 0.3  # mms to travel down from top for XY probing
speed: 2  # The speed (in mm/sec) to move tools down onto the probe
lift_speed: 4  # The speed (in mm/sec) to retract between probes
final_lift_z: 6 # Z Lift after probing done, should be greater than any Z variance between tools
sample_retract_dist:2
samples_tolerance:0.03
samples_tolerance_retries: 20
samples:8
samples_result: median # median, average
# Settings for nozzle probe calibration - optional.

probe: probe # name of the nozzle probe to use
trigger_to_bottom_z: 0.25 # Offset from probe trigger to vertical motion bottoms out.
# decrease if the nozzle is too high, increase if too low.


[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
# Approximate coordinates of the point directly above the tool calibration probe.
# Set these coordinates so the nozzle is centered over the probe pin with
# enough Z clearance to prevent a collision during tool changes.
variable_probe_x: 223     # Tool-calibration probe X position
variable_probe_y: 210     # Tool-calibration probe Y position
variable_probe_z: 60      # Travel height above the probe
gcode:
    BED_MESH_CLEAR
    G0 Z{probe_z} F10000
    G0 X{probe_x} Y{probe_y} F10000

[gcode_macro CALIBRATE_TOOL_OFFSETS]
gcode:
    {% set max_tool = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}
    T0
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    {% for tool in range(1, max_tool) %}
        T{tool}
        TOOL_CALIBRATE_TOOL_OFFSET
    {% endfor %}


[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
gcode:
    CALIBRATE_MOVE_OVER_PROBE
    M109 S150
    TOOL_LOCATE_SENSOR
    TOOL_CALIBRATE_PROBE_OFFSET
    M104 S0

[gcode_macro CALIBRATE_AND_SAVE_OFFSETS]
gcode:
    {% set max_tool = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}
    #TEST_TOOLS
    T0
    #CLEAN
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    {% for tool in range(1, max_tool) %}
        SAVE_GCODE_STATE
        T{tool}
		_TOOL_OFFSET_T T={tool} MOVE=0
        #CLEAN
        RESTORE_GCODE_STATE MOVE=1
        TOOL_CALIBRATE_TOOL_OFFSET
        _APPLY_LAST_RESULT_TO_TOOL_OFFSET T={tool}
    {% endfor %}
    DROP_TOOL
    G1 X20 Y220 F10000



[gcode_macro _APPLY_LAST_RESULT_TO_TOOL_OFFSET]
description: Apply printer.tools_calibrate.last_*_result to tool T - writes runtime
  _TOOL_OFFSET.t<N>_off_* AND saves to save_variables in one step.
gcode:
    {% if 'T' not in params %}
        RESPOND MSG="_APPLY_LAST_RESULT_TO_TOOL_OFFSET: missing T"
        _ERROR
    {% else %}
        {% set T = params.T|int %}
        {% set max_tool = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}
        {% if T < 0 or T >= max_tool %}
            RESPOND MSG="_APPLY_LAST_RESULT_TO_TOOL_OFFSET: bad T"
            _ERROR
        {% else %}
            {% set x = printer.tools_calibrate.last_x_result|float %}
            {% set y = printer.tools_calibrate.last_y_result|float %}
            {% set z = printer.tools_calibrate.last_z_result|float %}

            {% set kx = "t" ~ T ~ "_off_x" %}
            {% set ky = "t" ~ T ~ "_off_y" %}
            {% set kz = "t" ~ T ~ "_off_z" %}

            SET_GCODE_VARIABLE MACRO=_TOOL_OFFSET VARIABLE={kx} VALUE={x}
            SET_GCODE_VARIABLE MACRO=_TOOL_OFFSET VARIABLE={ky} VALUE={y}
            SET_GCODE_VARIABLE MACRO=_TOOL_OFFSET VARIABLE={kz} VALUE={z}

            {% set sx = "t" ~ T ~ "_gcode_x_offset" %}
            {% set sy = "t" ~ T ~ "_gcode_y_offset" %}
            {% set sz = "t" ~ T ~ "_gcode_z_offset" %}

            SAVE_VARIABLE VARIABLE={sx} VALUE={x}
            SAVE_VARIABLE VARIABLE={sy} VALUE={y}
            SAVE_VARIABLE VARIABLE={sz} VALUE={z}

            {action_respond_info(
                "APPLY: T" ~ T ~
                " X=" ~ x ~
                " Y=" ~ y ~
                " Z=" ~ z ~
                " (_TOOL_OFFSET + saved_vars)"
            )}
        {% endif %}
    {% endif %}


[gcode_macro SAVE_TOOL_GCODE_OFFSETS]
description: Save _TOOL_OFFSET tN_off_* into save_variables
gcode:
    {% if 'T' not in params %}
        RESPOND MSG="SAVE_TOOL_GCODE_OFFSETS: missing T"
        _ERROR
    {% else %}
        {% set T = params.T|int %}
        {% set max_tool = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}
        {% if T < 0 or T >= max_tool %}
            RESPOND MSG="SAVE_TOOL_GCODE_OFFSETS: bad T"
            _ERROR
        {% else %}
            {% set kx = "t" ~ T ~ "_off_x" %}
            {% set ky = "t" ~ T ~ "_off_y" %}
            {% set kz = "t" ~ T ~ "_off_z" %}

            {% set x = printer["gcode_macro _TOOL_OFFSET"][kx]|float %}
            {% set y = printer["gcode_macro _TOOL_OFFSET"][ky]|float %}
            {% set z = printer["gcode_macro _TOOL_OFFSET"][kz]|float %}

            {% set sx = "t" ~ T ~ "_gcode_x_offset" %}
            {% set sy = "t" ~ T ~ "_gcode_y_offset" %}
            {% set sz = "t" ~ T ~ "_gcode_z_offset" %}

            SAVE_VARIABLE VARIABLE={sx} VALUE={x}
            SAVE_VARIABLE VARIABLE={sy} VALUE={y}
            SAVE_VARIABLE VARIABLE={sz} VALUE={z}

            {action_respond_info(
                "SAVE_TOOL_GCODE_OFFSETS: T" ~ T ~
                " X=" ~ x ~
                " Y=" ~ y ~
                " Z=" ~ z
            )}
        {% endif %}
    {% endif %}


[gcode_macro TEST_OFFSET_PULL]
description: Dry-run test of pulling tool offsets from printer.tools_calibrate.
gcode:
    T0
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    _DUMP_TC_STATE LABEL="T0 sensor reference"

    SAVE_GCODE_STATE
    T1
    RESTORE_GCODE_STATE MOVE=1
    TOOL_CALIBRATE_TOOL_OFFSET
    _DUMP_TC_STATE LABEL="T1 after TOOL_CALIBRATE_TOOL_OFFSET"

    _DUMP_STORED_T1
    DROP_TOOL

[gcode_macro _DUMP_TC_STATE]
description: Print printer.tools_calibrate state. Called as a separate macro so
  Jinja re-evaluates fresh values after the previous Python command.
gcode:
    {% set label = params.LABEL|default("tc state") %}
    {% set rx = printer.tools_calibrate.last_x_result|float %}
    {% set ry = printer.tools_calibrate.last_y_result|float %}
    {% set rz = printer.tools_calibrate.last_z_result|float %}
    RESPOND MSG="--- {label} ---"
    RESPOND MSG="last_result: X={rx} Y={ry} Z={rz}"

[gcode_macro _DUMP_STORED_T1]
gcode:
    {% set cx = printer["gcode_macro _TOOL_OFFSET"].t1_off_x|float %}
    {% set cy = printer["gcode_macro _TOOL_OFFSET"].t1_off_y|float %}
    {% set cz = printer["gcode_macro _TOOL_OFFSET"].t1_off_z|float %}
    RESPOND MSG="--- Currently stored _TOOL_OFFSET T1 ---"
    RESPOND MSG="t1_off_x={cx} t1_off_y={cy} t1_off_z={cz}"
