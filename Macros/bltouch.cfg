[bltouch]
sensor_pin: PD12
control_pin: PD13
x_offset: 36.5
y_offset: -2.24
z_offset: 2.9
probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False

[bed_mesh]
speed: 150
horizontal_move_z: 7
mesh_min: 38, 30
mesh_max: 210, 200
probe_count: 5, 5
algorithm: lagrange
fade_start: 1
fade_end: 10
bicubic_tension: 0.15

[gcode_macro BED_CALIBRATION]
description: BLTouch-compatible bed calibration entry point used by START_PRINT
gcode:
   BED_MESH_CALIBRATE
