
[mcu eddy]
canbus_uuid: e819f0c053e5

[probe_eddy_current eddy]
sensor_type: ldc1612
frequency: 12000000
max_sensor_hz: 5000000
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -20
y_offset: -30

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 20, 15
mesh_max: 215, 190
probe_count: 9, 9
algorithm: bicubic


[gcode_macro BED_CALIBRATION]
gcode:
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z=6 retry_tolerance=1
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=3 METHOD=scan
    _Z_TILT_ADJUST horizontal_move_z=3 METHOD=scan
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro TAP_BASE_TOOL]
description: Tap with T0 to set true Z=0 via SET_KINEMATIC_POSITION
gcode:
    M109 T0 S150
    T0
    G91
    G1 E-1 F3600
    G90
    CLEAN
    CLEAN
    G90
    G1 Z5 F300
    G1 X120 Y110 F12000
    PROBE METHOD=tap
    M400
    _APPLY_TAP_KINEMATIC
    M104 T0 S0
    DROP_TOOL

[gcode_macro _APPLY_TAP_KINEMATIC]
gcode:
    {% set z = printer.toolhead.position.z %}
    {% set z_probe = printer.probe.last_probe_position.z %}
    {% set eddy_z = printer["gcode_macro GLOBAL_STATE"].eddy_z|float %}
    {% set new_z = z - z_probe + eddy_z %}
    M118 TAP_BASE_TOOL: z={z} probe_z={z_probe} eddy_z={eddy_z} -> kinematic Z={new_z}
    SET_KINEMATIC_POSITION Z={new_z}
