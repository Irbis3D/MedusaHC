[gcode_macro TOOL_OFFSET]
description: Store per-tool gcode offsets

# Z offset applied when T0 is active.
variable_t0_off_z: 0.0
# X offset applied when T0 is active.
variable_t0_off_x: 0.0
# Y offset applied when T0 is active.
variable_t0_off_y: 0.0

# Z offset applied when T1 is active.
variable_t1_off_z:  0.0
# X offset applied when T1 is active.
variable_t1_off_x:  0.0
# Y offset applied when T1 is active.
variable_t1_off_y:  0.0

# Z offset applied when T2 is active.
variable_t2_off_z:  0.0
# X offset applied when T2 is active.
variable_t2_off_x:  0.0
# Y offset applied when T2 is active.
variable_t2_off_y:  0.0

# Z offset applied when T3 is active.
variable_t3_off_z:  0.0
# X offset applied when T3 is active.
variable_t3_off_x:  0.0
# Y offset applied when T3 is active.
variable_t3_off_y:  0.0

gcode:
