[include MHC_config.cfg]
[include MHC_macros.cfg]


[save_variables]
filename: ~/printer_data/config/saved_vars.cfg

[gcode_macro TOOL_CFG]
# Rack orientation: 1 for front docks, -1 for rear docks.
variable_tools_direction: 1

# X coordinate of the T0 dock center.
variable_x_t0: 17
# X coordinate of the T1 dock center.
variable_x_t1: 82
# X coordinate of the T2 dock center.
variable_x_t2: 147
# X coordinate of the T3 dock center.
variable_x_t3: 212
# Safe Y coordinate used before entering or after leaving a dock.
variable_y_safe: -5
# Y coordinate where a tool engages the dock latch.
variable_y_latch: -57.6
# X movement used to engage or release the dock latch.
variable_x_shift: 9

# Acceleration used during tool-change travel moves.
variable_fast_accel: 10000
# Fast travel speed between safe and dock positions.
variable_fast_speed: 300
# Slow speed used while engaging or releasing a dock.
variable_slow_speed: 40
# Speed used for the fixed brush-cleaning path.
variable_clean_speed: 50

# Y coordinate of the nozzle priming path.
variable_y_prime: -45.0
# Y coordinate of the nozzle brush.
variable_y_brush: -45.0
# X distance from the dock center to the priming and cleaning path.
variable_x_prime_shift: 12

# Motor rotation distance that opens the feeder and releases the filament.
variable_e_open: -5
# Motor rotation distance that closes the feeder and grips the filament.
variable_e_close: 3

# Servo angle that presses the upper auxiliary gear against the motor for opening.
variable_servo_open_angle: 90
# Servo angle that moves the upper auxiliary gear away for the closed position.
variable_servo_close_angle: 180

# Temporary extruder-current multiplier used while opening the feeder.
variable_e_cur_high_mult: 1.7

gcode:

[gcode_macro GLOBAL_STATE]
# Number of installed tools.
variable_max_tool: 4

# Additional Z offset applied after tap.
variable_eddy_z: 0.0

#------------- Do not change ---------------

# Current print layer reported by the slicer integration.
variable_layer: 0

# X/Y motor currents are not currently used and remain commented for future use.
# Only the extruder current (e_cur / e_cur_high) is active; it is boosted
# during feeder OPEN to avoid skipped steps on the latch.
#variable_x_cur: 0.0
#variable_x_cur_high: 0.0      # x_cur * mult
#variable_y_cur: 0.0
#variable_y_cur_high: 0.0      # y_cur * mult
# Extruder run current detected during initialization.
variable_e_cur: 0.0
# Boosted extruder current used to operate the feeder latch.
variable_e_cur_high: 0.0

# Tool requested by the current tool-change operation.
variable_target_tool: -1
# Last internal MedusaHC error state.
variable_error_state: 0
# Stored T0 probe Z reference used during calibration.
variable_t0_probe_z: 0.0

# Feeder latch state: 0 closed, 1 open.
variable_feeder_open: 0

# Cached fast travel feed rate in mm/min.
variable_fast_feedrate: 0.0
# Cached slow docking feed rate in mm/min.
variable_slow_feedrate: 0.0
# Cached cleaning feed rate in mm/min.
variable_clean_feedrate: 0.0

#variable_prime_flag: 0

gcode:

[gcode_macro TOOL_STATE_0]
# Filament extruded during the normal prime for this tool.
variable_prime_amount: 13
# Extrusion speed used for the normal prime.
variable_prime_speed: 30
# Retraction performed after the normal prime.
variable_prime_retract: 0.7
# Retraction speed used after the normal prime.
variable_prime_retract_speed: 40

# Enables or disables the cleaning movement for this tool.
variable_clean_move: 1
# X amplitude of the cleaning movement.
variable_x_clean_move: 8
# Y amplitude of the cleaning movement.
variable_y_clean_move: 5
# Travel speed of the cleaning movement.
variable_clean_move_speed: 250
# Slow extrusion speed used while cleaning the PTFE path.
variable_ptfe_clean_slow_speed: 12.5
# Retraction performed after cleaning.
variable_clean_retract: 0.8
# Retraction speed used after cleaning.
variable_clean_retract_speed: 35

# Enables first-use priming for this tool. The runtime flag below is managed automatically.
variable_first_prime_enabled: 1
variable_first_prime_flag: 1  # Internal state: 0 = pending, 1 = already completed.
# Extra filament extruded on the first use of this tool.
variable_first_prime_amount: 5
# Extrusion speed used for the first prime.
variable_first_prime_speed: 6
gcode:


