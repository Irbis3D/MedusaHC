[include MHC_config.cfg]
[include MHC_macros.cfg]


[save_variables]
filename: ~/printer_data/config/saved_vars.cfg

[gcode_macro TOOL_CFG]
# Tool dock orientation relative to the print bed.
# 1 = front reference orientation, -1 = rear orientation rotated by 180 degrees.
variable_tools_direction: 1

# Base X coordinates for each tool dock.
variable_x_t0: 17
variable_x_t1: 82
variable_x_t2: 147
variable_x_t3: 212
# Common Y coordinates for the dock area.
variable_y_safe: -5      # Safe Y coordinate in front of the bed.
variable_y_latch: -57.6  # Front dock latch Y coordinate.
# Lateral latch movement distance used by SET and DROP.
variable_x_shift: 9  # Latch movement distance in mm.

variable_fast_accel: 10000  # Acceleration used during tool changes.
variable_fast_speed: 300  # Fast movement speed in mm/s.
variable_slow_speed: 40  # Slow docking and undocking speed in mm/s.
variable_clean_speed: 50  # Brush cleaning speed in mm/s.

# Prime and brush coordinates.
variable_y_prime: -45.0  # Prime Y coordinate.
variable_y_brush: -45.0  # Brush Y coordinate.
variable_x_prime_shift: 12  # X distance from the dock center to the cleaning path.



# Feeder open/close extruder rotation.
# Value is the distance and direction the extruder motor rotates (in mm of
# filament) to operate the feeder latch. Sign sets the direction:
# Open is negative and close is positive by default. Reverse both signs when
# the extruder mounting or wiring reverses the motor direction.
variable_e_open: -5  # Extruder movement used to open the feeder.
variable_e_close: 3  # Extruder movement used to close the feeder.

# Extruder "high current" multiplier applied on top of the base TMC run_current.
# Used by OPEN to temporarily boost extruder torque when opening the
# feeder latch, so the motor can open without
# skipping steps. The boosted value is computed at startup by INIT_SENSOR_STATE
# and stored in GLOBAL_STATE.e_cur_high. Typical range: 1.3 - 1.8.
variable_e_cur_high_mult: 1.7

gcode:

[gcode_macro GLOBAL_STATE]
# Number of tools installed in this build.
variable_max_tool: 4

# Additional Z offset applied after tap.
variable_eddy_z: 0.0

#------------- Do not change ---------------

variable_layer: 0

# X/Y motor currents are not currently used and remain commented for future use.
# Only the extruder current (e_cur / e_cur_high) is active; it is boosted
# during feeder OPEN to avoid skipped steps on the latch.
#variable_x_cur: 0.0
#variable_x_cur_high: 0.0      # x_cur * mult
#variable_y_cur: 0.0
#variable_y_cur_high: 0.0      # y_cur * mult
variable_e_cur: 0.0
variable_e_cur_high: 0.0      # e_cur * TOOL_CFG.e_cur_high_mult

variable_target_tool: -1

variable_error_state: 0
variable_t0_probe_z: 0.0

# Feeder latch state (for future use)
variable_feeder_open: 0       # 0 = closed, 1 = open

variable_fast_feedrate: 0.0   # fast_speed * 60, set by INIT_SENSOR_STATE
variable_slow_feedrate: 0.0   # slow_speed * 60, set by INIT_SENSOR_STATE
variable_clean_feedrate: 0.0  # clean_speed * 60, set by INIT_SENSOR_STATE

#variable_prime_flag: 0

gcode:

[gcode_macro TOOL_STATE_0]
variable_prime_amount: 13
variable_prime_speed: 30
variable_prime_retract: 0.7
variable_prime_retract_speed: 40

variable_clean_move: 1
variable_x_clean_move: 8
variable_y_clean_move: 5
variable_clean_move_speed: 250
variable_ptfe_clean_slow_speed: 12.5
variable_clean_retract: 0.8
variable_clean_retract_speed: 35

variable_first_prime_flag: 1
variable_first_prime_amount: 5
variable_first_prime_speed: 6
gcode:


